name: Deploy to Firebase Hosting

# Builds the game and publishes it to Firebase Hosting (project actionludo-df9cc):
#   - pushes to main go live
#   - pull requests get a temporary preview URL, posted as a comment on the PR
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT_ACTIONLUDO_DF9CC: the JSON key of a
# service account that can deploy to the project. `npx firebase-tools init hosting:github`
# creates it for you, or add it by hand under Settings -> Secrets and variables -> Actions.
# Without the secret the workflow still builds and tests, and skips the deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTIONLUDO_DF9CC != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy live
        if: env.HAS_FIREBASE_KEY == 'true' && github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTIONLUDO_DF9CC }}
          projectId: actionludo-df9cc
          channelId: live
      - name: Deploy a preview channel for the pull request
        if: env.HAS_FIREBASE_KEY == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTIONLUDO_DF9CC }}
          projectId: actionludo-df9cc
